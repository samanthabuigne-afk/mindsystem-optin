<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mind System — Le système IA qui scale ton business</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://api.leadconnectorhq.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#811AFF; --violet-2:#A352FF; --ink:#15131d; --muted:#5b5668;
    --line:#ece9f1; --bg:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 520px at 72% 8%, rgba(129,26,255,.16), rgba(129,26,255,0) 60%),
      radial-gradient(900px 480px at 10% 0%, rgba(163,82,255,.10), rgba(163,82,255,0) 55%),
      #ffffff;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:1140px;margin:0 auto;padding:16px 18px 56px}
  /* Header pill */
  .bar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:var(--ink);color:#fff;border-radius:999px;
    padding:14px 24px;box-shadow:0 10px 30px rgba(21,19,29,.18);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:.2px}
  .brand .logo{
    width:30px;height:30px;border-radius:8px;flex:0 0 auto;
    background:#fff;display:flex;align-items:center;justify-content:center;
  }
  .brand .logo svg{width:18px;height:18px}
  .bar .tag{font-weight:600;font-size:14.5px;color:#d8d4e4;text-align:right}
  /* Layout */
  .grid{
    display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;
    margin-top:34px;
  }
  .lead h1{
    font-size:clamp(34px,6.2vw,58px);line-height:1.02;font-weight:800;margin:0 0 20px;
    letter-spacing:-.5px;
  }
  .lead h1 .ia{color:var(--violet);font-style:italic}
  .lead p.sub{font-size:clamp(16px,2.3vw,19px);line-height:1.5;color:#3a3646;margin:0 0 26px;max-width:30ch}
  .checks{display:flex;flex-wrap:wrap;gap:12px 22px;margin:0;padding:0;list-style:none}
  .checks li{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15.5px}
  .checks .ck{
    width:22px;height:22px;border-radius:999px;flex:0 0 auto;
    background:rgba(129,26,255,.12);color:var(--violet);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;
  }
  /* Form card */
  .card{
    background:#fff;border:1px solid var(--line);border-radius:22px;
    box-shadow:0 24px 60px rgba(21,19,29,.10);
    padding:12px 12px 6px;min-height:560px;
  }
  .card iframe{width:100%;border:none;display:block;min-height:560px;border-radius:16px;background:transparent}
  /* Mobile */
  @media (max-width:860px){
    .wrap{padding:12px 14px 40px}
    .bar{padding:12px 16px;border-radius:22px}
    .bar .tag{font-size:12.5px}
    .grid{grid-template-columns:1fr;gap:22px;margin-top:22px}
    .lead{order:1}
    .card{order:2;min-height:620px;padding:8px}
    .card iframe{min-height:620px}
    .lead p.sub{max-width:none}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="bar">
      <div class="brand">
        <span class="logo">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 19V5l6 7 6-7v14" stroke="#15131d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M18 19V9l3 3" stroke="#811AFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        Mind System
      </div>
      <div class="tag">Le système IA qui scale ton business</div>
    </header>

    <main class="grid">
      <section class="lead">
        <h1>Explose ton business grâce à ton <span class="ia">IA coach</span>.</h1>
        <p class="sub">Le coach IA que seul Mind System sait construire. Il fait progresser tes clients, les mène jusqu'aux objectifs, et t'ouvre une nouvelle ligne de CA.</p>
        <ul class="checks">
          <li><span class="ck">✓</span> Ta méthode</li>
          <li><span class="ck">✓</span> Ta voix</li>
          <li><span class="ck">✓</span> Clé en main</li>
        </ul>
      </section>

      <section class="card">
        <iframe
          src="https://api.leadconnectorhq.com/widget/form/L7MlsDFOg7sc7ko8As9s"
          id="inline-L7MlsDFOg7sc7ko8As9s"
          data-form-id="L7MlsDFOg7sc7ko8As9s"
          data-layout-iframe-id="inline-L7MlsDFOg7sc7ko8As9s"
          data-height="560"
          title="DDD Optin (Sam)"></iframe>
      </section>
    </main>
  </div>

  <!-- GHL form embed: gère le redimensionnement + la redirection vers /ddd-lp -->
  <script src="https://link.msgsndr.com/js/form_embed.js"></script>

  <!-- Meta Pixel + event Lead à la soumission -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window,document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init','1622219315920128');
    fbq('track','PageView');

    // Fire "Lead" une seule fois quand le form L7Ml confirme la soumission.
    (function(){
      var fired=false;
      function fireLead(){ if(fired)return; fired=true; try{ fbq('track','Lead'); }catch(e){} }
      window.addEventListener('message',function(ev){
        try{
          var o=ev.origin||'';
          if(o.indexOf('leadconnectorhq')===-1 && o.indexOf('msgsndr')===-1) return;
          var d=ev.data;
          var s=typeof d==='string'?d:JSON.stringify(d||'');
          if(/set-sticky-contacts|form[-_ ]?submit|formSubmit|onFormSubmit/i.test(s)) fireLead();
        }catch(e){}
      },false);
    })();
  </script>
</body>
</html>
